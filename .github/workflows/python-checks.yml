name: Python project checks

on:
  push:
    branches: [main, ui-redesign]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Check required project assets
        run: |
          test -f models/covid_death_predictor.pkl
          test -f data/country_wise_latest.csv
          test -f data/covid_merged.csv
          test -f src/app.py
